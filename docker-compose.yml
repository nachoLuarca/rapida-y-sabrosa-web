# PostgreSQL para desarrollo y tests. Se levanta con `npm run db:up` y se baja con `npm run db:down`.
# Crea dos bases: rys (desarrollo y demo) y rys_test (tests de la API, que la vacían en cada archivo).
name: rapida-y-sabrosa

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rys
      POSTGRES_PASSWORD: rys
      POSTGRES_DB: rys
      TZ: America/Santiago
    ports:
      # Solo desde este computador: la base no queda expuesta a la red local.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Solo corre la primera vez, con el volumen vacío.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP y contra rys_test: durante la inicialización el servidor temporal no escucha por TCP, así que
      # "sano" significa que terminó de crear las dos bases.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'rys', '-d', 'rys_test']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
