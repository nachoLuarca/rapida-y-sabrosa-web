name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Un test colgado no debe dejar el job pegado.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Todo corre desde la raíz del monorepo: un solo npm ci instala los workspaces, y lint, typecheck,
      # test y build recorren apps/* y packages/*. build:demo es solo de apps/web.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
